<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proverbs Daily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold:        #c9a84c;
      --gold-light:  #e8c97e;
      --gold-dim:    #7a5f28;
      --bg:          #0d0d0d;
      --bg-card:     #131313;
      --text-muted:  #5a4a2a;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--gold);
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.25rem;
      overflow-x: hidden;
    }

    /* ── ambient glow behind the card ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 45%, rgba(201,168,76,.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── decorative top ornament ── */
    .ornament {
      font-size: 1.4rem;
      letter-spacing: .35em;
      color: var(--gold-dim);
      animation: fadeSlideDown .9s ease both;
      animation-delay: .1s;
      margin-bottom: 1.6rem;
      user-select: none;
    }

    /* ── wordmark ── */
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1rem, 4vw, 1.25rem);
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold);
      animation: fadeSlideDown .9s ease both;
      animation-delay: .25s;
      margin-bottom: 3.5rem;
    }

    /* ── card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      background: var(--bg-card);
      border: 1px solid rgba(201,168,76,.18);
      border-radius: 4px;
      padding: clamp(2.5rem, 8vw, 4.5rem) clamp(2rem, 8vw, 4rem);
      animation: fadeScaleIn 1.1s cubic-bezier(.22,.61,.36,1) both;
      animation-delay: .4s;
      box-shadow:
        0 0 0 1px rgba(201,168,76,.04),
        0 8px 60px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(201,168,76,.08);
    }

    /* corner flourishes */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--gold-dim);
      border-style: solid;
      opacity: .55;
    }
    .card::before {
      top: 16px; left: 16px;
      border-width: 1px 0 0 1px;
    }
    .card::after {
      bottom: 16px; right: 16px;
      border-width: 0 1px 1px 0;
    }

    /* ── reference ── */
    .reference {
      font-family: 'Cinzel', serif;
      font-size: clamp(.65rem, 2.5vw, .78rem);
      font-weight: 400;
      letter-spacing: .22em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 1.6rem;
      animation: fadeIn 1s ease both;
      animation-delay: .7s;
    }

    /* ── divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 2rem;
      animation: fadeIn 1s ease both;
      animation-delay: .75s;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim));
    }
    .divider-line:last-child {
      background: linear-gradient(to left, transparent, var(--gold-dim));
    }
    .divider-gem {
      width: 5px;
      height: 5px;
      background: var(--gold-dim);
      transform: rotate(45deg);
    }

    /* ── verse ── */
    .verse {
      font-size: clamp(1.55rem, 5vw, 2.3rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1.55;
      color: var(--gold-light);
      letter-spacing: .01em;
      animation: fadeIn 1.2s ease both;
      animation-delay: .85s;
    }

    .verse em {
      font-style: normal;
      font-weight: 600;
      color: #f0d98a;
    }

    /* ── footer ── */
    footer {
      margin-top: 3.5rem;
      text-align: center;
      animation: fadeIn 1s ease both;
      animation-delay: 1.1s;
      z-index: 1;
    }

    .footer-divider {
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
      margin: 0 auto .85rem;
      opacity: .5;
    }

    .footer-logo {
      font-family: 'Cinzel', serif;
      font-size: clamp(.58rem, 2.2vw, .68rem);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .footer-logo span {
      color: var(--gold-dim);
    }

    /* ── keyframes ── */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeScaleIn {
      from { opacity: 0; transform: scale(.97) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── subtle pulse on the verse glow ── */
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 18px rgba(240,217,138,.08); }
      50%       { text-shadow: 0 0 32px rgba(240,217,138,.18); }
    }

    .verse {
      animation:
        fadeIn 1.2s ease both .85s,
        glowPulse 5s ease-in-out infinite 2s;
    }

    /* ── responsive tweaks ── */
    @media (max-width: 420px) {
      .card::before, .card::after { display: none; }
    }
  </style>
</head>
<body>

  <p class="ornament">✦ &nbsp; ✦ &nbsp; ✦</p>
  <h1 class="brand-title">Proverbs Daily</h1>

  <article class="card">
    <p class="reference">Proverbs &nbsp;1 : 7</p>

    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-gem"></span>
      <span class="divider-line"></span>
    </div>

    <blockquote class="verse">
      "The <em>fear of the Lord</em> is the beginning of wisdom."
    </blockquote>
  </article>

  <footer>
    <div class="footer-divider"></div>
    <p class="footer-logo"><span>Sacred Studios</span> &nbsp;·&nbsp; All rights reserved</p>
  </footer>

</body>
</html>
